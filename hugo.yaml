        - "Linux"
        - "Docker"
        - "DNS"
        - "Windows"
        - "Active Directory"
        - "Microsoft Azure"
        - "Cisco Networking"
        - "Cybersecurity"
        - "Git & GitHub"

  # Experience
  experience:
    enable: true
    title: "Professional Experience"

    items:
      - company: "The 20"
        companyUrl: "https://www.the20msp.com/"

        jobs:
          - name: "IT Support Desk Specialist"
            date: "2023 - present"

            content: |-
              - Administer and support **Active Directory, Microsoft 365, and Exchange** environments, including user accounts, access permissions, password management, and Group Policy.
              - Provide **technical support** for Windows and macOS environments across remote organizations.
              - Troubleshoot network and connectivity issues involving **DNS, DHCP, VPNs, TCP/IP, wireless networks, and VLAN-related configurations**.
              - Diagnose and resolve complex hardware, software, authentication, endpoint, and application issues while minimizing user downtime.
              - Support endpoint security and identity-management practices to help protect client systems, accounts, and organizational data.
              - Collaborate with technical teams on escalations, infrastructure issues, and implementation of IT solutions.
              - Maintain detailed technical documentation, troubleshooting records, and knowledge-base information to improve resolution efficiency and knowledge sharing.
              - Install, configure, maintain, and troubleshoot workstation hardware, operating systems, software, and supporting IT infrastructure.


      - company: "Computacenter"
        companyUrl: "https://www.computacenter.com/en-us"

        jobs:
          - name: "Level One Analyst / Customer Engineer"
            date: "2022"

            content: |-
              - Deployed and configured new laptops as part of enterprise device refresh and provisioning initiatives.
              - Supported and troubleshot **Lenovo laptops, iPads, mobile devices, and cloud-managed endpoints**.
              - Managed devices within **MDM and cloud-based management environments**, helping maintain device compliance and availability.
              - Diagnosed and resolved issues involving enterprise applications including **Salesforce, Veeva, and Concur**.
              - Worked within defined **service-level agreements (SLAs)** while prioritizing first-contact resolution and minimizing user downtime.
              - Documented incidents, troubleshooting steps, and resolutions to support escalation and service continuity.

      - company: "WatchGuard Video / Motorola Solutions"
        companyUrl: "https://www.motorolasolutions.com/en_us/video-security-access-control/in-car-video-systems/4re-in-car-video-system.html"

        jobs:
          - name: "System Technologist 2"
            date: "2020 - 2021"

            content: |-
              - Supported integrated public-safety technology environments involving **body cameras, in-vehicle cameras, computer systems, servers, wireless networks, cellular connectivity, and cloud services**.
              - Diagnosed hardware, software, network, wireless, cellular, and cloud connectivity issues across field-deployed systems.
              - Installed, maintained, and updated applications and systems in both **Windows and Linux environments**.
              - Supported server infrastructure and cloud-based video upload services used by law-enforcement organizations.
              - Collaborated across multiple technical support tiers to diagnose and resolve high-priority and complex incidents.
              - Performed software and system updates and participated in **beta testing** of new and existing applications.
              - Delivered technical assistance and training to end users on system operation and troubleshooting.
              - Handled highly sensitive information associated with **law-enforcement investigations and court proceedings** in accordance with security and confidentiality requirements.

      - company: "Columbia Advisory Group"
        companyUrl: "https://columbiaadvisory.com/"

        jobs:
          - name: "Classroom Technology Specialist"
            date: "2019 - 2020"

            content: |-
              - Monitored classroom technology and audiovisual systems using centralized management and monitoring platforms.
              - Diagnosed and resolved hardware, software, connectivity, and classroom technology issues in real time to minimize instructional disruption.
              - Maintained accurate equipment status, inventory, and maintenance records.
              - Participated in the planning, installation, configuration, and deployment of classroom technology systems and equipment.
              - Provided on-site technical support for faculty, staff, and educational environments.
              - Coordinated equipment maintenance and system readiness to ensure reliable classroom technology availability.

      - company: "State Farm"
        companyUrl: "https://www.statefarm.com/"

        jobs:
          - name: "Escalation Specialist"
            date: "2013 - 2019"

            content: |-
              - Progressed through **three promotions**, advancing from Customer Service Representative to Coordinator and ultimately Escalation Specialist.
              - Served as a **subject-matter expert and escalation point**, coordinating complex issues across departments and stakeholders.
              - Trained, mentored, and onboarded team members on organizational processes, systems, and service procedures.
              - Collaborated with analysts to identify recurring trends, improve processes, and accelerate problem resolution.
              - Supported implementation and communication of operational and technology-related changes as an On-The-Ground team representative.
              - Maintained and supported workplace technology assets, including **software, operating system updates, and point-of-sale systems**.
              - Developed strong experience in technical communication, escalation management, documentation, customer service, and cross-functional problem solving.

