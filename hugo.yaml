  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/computer.png"

    content: |-
      I work extensively with Linux, macOS, Windows, networking, Docker, DNS, virtualization, cybersecurity, and cloud technologies. I maintain a home lab built around Raspberry Pi and Orange Pi systems and am developing a Windows Server and Active Directory virtualization lab.

      I am currently studying for the Cisco CCNA while continuing to build practical projects in networking, systems administration, automation, and Microsoft Azure.

    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"

